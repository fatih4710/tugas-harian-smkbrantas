                        <label for="tugas">Nilai Tugas</label>
                        <input type="number" id="tugas" min="0" max="100" placeholder="Contoh: 85">

                    <div class="isian">
                        <label for="uas">Nilai UAS</label>
                        <input type="number" id="uas" min="0" max="100" placeholder="Contoh: 89">
                    </div>
                </div>

                <button type="button" id="tombol" class="tombol">Hitung</button>
